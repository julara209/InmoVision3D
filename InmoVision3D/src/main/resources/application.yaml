spring:
  application:
    name: InmoVision3D

  datasource:
    url: jdbc:mariadb://localhost:3307/inmovision3d
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  # Las imágenes de inmuebles y los planos se guardan aquí:
  #   src/main/resources/static/uploads/inmuebles
  #   src/main/resources/static/uploads/planos
  upload-dir: src/main/resources/static/uploads

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
