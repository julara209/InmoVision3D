<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carga masiva de inmuebles</title>
</head>
<body>
    <h1>Carga masiva de inmuebles</h1>

    {% if creados %}
        <p>{{ creados }} inmueble(s) cargado(s) correctamente. Quedaron pendientes de aprobación.</p>
    {% endif %}

    {% if errores %}
        <ul>
            {% for error in errores %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cargar inmuebles</button>
    </form>

    <a href="/admin/">Volver al administrador</a>
</body>
</html>
